<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horas — Gestor de tiempo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --k:#111010; --w:#EDEBE7; --g:#8a8780;
  --line: rgba(237,235,231,0.14);
  --line-soft: rgba(237,235,231,0.08);
  --accent:#c44a3a;
  --accent-ok:#6c9e7a;
  --accent-warn:#d4a13a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--k); color:var(--w); font-family:'DM Sans',sans-serif; font-weight:300; display:flex; min-height:100vh}
::selection{background:var(--w);color:var(--k)}
h1,h2,h3{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em; font-weight:400}
.mono{font-family:'DM Mono',monospace}
.label{font-family:'DM Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--g)}

/* ---------- SIDEBAR ---------- */
.sidebar{width:220px; flex-shrink:0; height:100vh; position:sticky; top:0; border-right:1px solid var(--line); padding:28px 22px; display:flex; flex-direction:column}
.brand{margin-bottom:44px}
.brand .vk{font-family:'Playfair Display',serif; font-style:italic; font-size:22px; letter-spacing:0.02em}
.brand .sub{font-family:'DM Mono',monospace; font-size:10px; color:var(--g); text-transform:uppercase; letter-spacing:0.15em; margin-top:4px}
nav{display:flex; flex-direction:column; gap:2px}
nav button{all:unset; cursor:pointer; padding:11px 10px; font-family:'DM Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--g); border-left:2px solid transparent; transition:all .15s}
nav button:hover{color:var(--w)}
nav button.on{color:var(--w); border-left-color:var(--w); background:var(--line-soft)}
.sidebar-foot{margin-top:auto; padding-top:20px; border-top:1px solid var(--line)}
.tagline{font-family:'Playfair Display',serif; font-style:italic; font-size:11px; color:var(--g); line-height:1.5}

/* ---------- MAIN ---------- */
main{flex:1; padding:36px 44px; max-width:1080px}
.view{display:none}
.view.on{display:block}
.view-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; gap:20px; flex-wrap:wrap}
.view-head h1{font-size:36px}
.back-link{all:unset; cursor:pointer; color:var(--g); font-family:'DM Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:18px; display:inline-block}
.back-link:hover{color:var(--w)}

.btn{all:unset; cursor:pointer; font-family:'DM Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; padding:10px 18px; border:1px solid var(--w); color:var(--w); transition:all .15s}
.btn:hover{background:var(--w); color:var(--k)}
.btn.primary{background:var(--w); color:var(--k)}
.btn.primary:hover{background:transparent; color:var(--w)}
.btn.danger{border-color:var(--accent); color:var(--accent)}
.btn.danger:hover{background:var(--accent); color:var(--w)}
.btn.small{padding:6px 12px; font-size:10px}
.btn.ghost{border-color:transparent; color:var(--g)}
.btn.ghost:hover{color:var(--w); background:transparent}

select, input, textarea{background:transparent; border:1px solid var(--line); color:var(--w); font-family:'DM Sans',sans-serif; font-size:14px; padding:10px 12px; width:100%}
select:focus, input:focus, textarea:focus{outline:none; border-color:var(--w)}

/* ---------- PROYECTOS ---------- */
.proj-grid{display:grid; gap:12px}
.proj-card{border:1px solid var(--line); padding:20px 22px; cursor:pointer; transition:border-color .15s; display:flex; justify-content:space-between; align-items:center; gap:16px}
.proj-card:hover{border-color:var(--w)}
.proj-name{font-size:18px}
.proj-client{font-family:'DM Mono',monospace; font-size:11px; color:var(--g); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px}
.proj-meta{text-align:right; font-family:'DM Mono',monospace; font-size:12px; color:var(--g); white-space:nowrap}
.pill{font-family:'DM Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.06em; padding:3px 8px; border:1px solid var(--line); color:var(--g); display:inline-block}
.pill.on-track{color:var(--accent-ok); border-color:var(--accent-ok)}
.pill.high{color:var(--accent); border-color:var(--accent)}

/* ---------- DETALLE DE PROYECTO ---------- */
.proj-detail-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap; gap:14px}
.proj-detail-head .proj-client{margin-top:6px}
.section-title{font-size:15px; margin:32px 0 14px; color:var(--g); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.08em; font-weight:400; display:flex; justify-content:space-between; align-items:center}

.task-row{display:grid; grid-template-columns:1fr 90px 90px 90px auto; gap:12px; align-items:center; padding:13px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
.task-row .title{font-size:14px}
.task-row .desc{color:var(--g); font-size:12px; margin-top:2px}
.task-row .deadline{font-family:'DM Mono',monospace; font-size:11px; color:var(--g)}
.task-actions{display:flex; gap:6px}
.task-actions .icon-btn{all:unset; cursor:pointer; color:var(--g); font-size:13px; padding:4px 6px}
.task-actions .icon-btn:hover{color:var(--w)}

.entry-row{display:grid; grid-template-columns:100px 1fr 70px 30px; gap:12px; align-items:start; padding:12px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
.entry-row .fecha{font-family:'DM Mono',monospace; color:var(--g); font-size:11px}
.entry-row .desc{color:var(--w)}
.entry-row .tarea-ref{color:var(--g); font-size:11px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.06em; margin-top:2px}
.entry-row .horas{font-family:'DM Mono',monospace; text-align:right}
.entry-row .del{color:var(--g); cursor:pointer; text-align:right}
.entry-row .del:hover{color:var(--accent)}

/* ---------- PLAZOS ---------- */
.deadline-item{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:1px solid var(--line); margin-bottom:8px; cursor:pointer}
.deadline-item:hover{border-color:var(--w)}
.deadline-item.overdue{border-color:var(--accent)}
.deadline-item.soon{border-color:var(--accent-warn)}
.deadline-info .t{font-size:14px}
.deadline-info .p{font-family:'DM Mono',monospace; font-size:11px; color:var(--g); text-transform:uppercase; letter-spacing:0.06em; margin-top:3px}
.deadline-date{font-family:'DM Mono',monospace; font-size:12px; white-space:nowrap}
.deadline-date.overdue{color:var(--accent)}
.deadline-date.soon{color:var(--accent-warn)}

/* ---------- INFORMES ---------- */
.cards-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:36px}
.stat-card{border:1px solid var(--line); padding:20px}
.stat-num{font-family:'Bebas Neue',sans-serif; font-size:38px}
.chart-block{margin-bottom:40px}
.chart-row{display:grid; grid-template-columns:150px 1fr 60px; gap:14px; align-items:center; padding:9px 0}
.chart-bar-track{height:14px; background:var(--line-soft)}
.chart-bar-fill{height:100%; background:var(--w)}
table.report{width:100%; border-collapse:collapse; font-size:13px}
table.report th{text-align:left; font-family:'DM Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--g); padding:10px 8px; border-bottom:1px solid var(--line)}
table.report td{padding:12px 8px; border-bottom:1px solid var(--line-soft)}
table.report tr:hover td{background:var(--line-soft)}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* ---------- MODAL ---------- */
.modal-bg{display:none; position:fixed; inset:0; background:rgba(17,16,16,0.85); z-index:200; align-items:center; justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--k); border:1px solid var(--line); padding:32px; width:440px; max-width:92vw; max-height:86vh; overflow-y:auto}
.modal h2{font-size:24px; margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block; margin-bottom:6px}
.field-row{display:flex; gap:12px}
.field-row > *{flex:1}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px}

.empty{color:var(--g); font-size:13px; padding:30px 0; text-align:center; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.08em}
.toast{position:fixed; bottom:24px; right:24px; background:var(--w); color:var(--k); padding:12px 20px; font-family:'DM Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; opacity:0; transform:translateY(10px); transition:all .2s; z-index:300}
.toast.on{opacity:1; transform:translateY(0)}

@media(max-width:820px){
  html{-webkit-text-size-adjust:100%}
  body{flex-direction:column; padding-bottom:74px}
  .sidebar{width:100%; height:auto; position:sticky; top:0; z-index:140; flex-direction:row; align-items:center; justify-content:space-between; padding:14px 18px; border-right:none; border-bottom:1px solid var(--line); background:var(--k)}
  .brand{margin-bottom:0}
  .sidebar-foot{display:none}
  nav{position:fixed; left:0; right:0; bottom:0; z-index:150; flex-direction:row; justify-content:space-around; gap:0; background:var(--k); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1; text-align:center; padding:10px 4px; font-size:10px; border-left:none; border-top:2px solid transparent; letter-spacing:0.06em}
  nav button.on{border-left-color:transparent; border-top-color:var(--w); background:transparent}
  main{padding:20px 16px 8px}
  .view-head{align-items:flex-start}
  .view-head h1{font-size:28px}
  .view-head .btn{width:100%}
  select, input, textarea{font-size:16px; padding:12px 12px}
  .btn{padding:13px 18px; font-size:11.5px}
  .btn.small{padding:10px 14px}

  .proj-card{flex-direction:column; align-items:flex-start; gap:8px}
  .proj-meta{text-align:left}

  .task-row{display:flex; flex-direction:column; gap:6px; padding:14px 30px 14px 0; position:relative}
  .task-actions{position:absolute; top:14px; right:0; flex-direction:column}

  .entry-row{display:flex; flex-direction:column; gap:3px; padding:14px 30px 14px 0; position:relative}
  .entry-row .del{position:absolute; top:14px; right:0}
  .entry-row .horas{text-align:left}

  .deadline-item{flex-direction:column; align-items:flex-start; gap:6px}

  .cards-row{grid-template-columns:1fr 1fr; gap:10px}
  .stat-num{font-size:30px}
  .chart-row{grid-template-columns:1fr; gap:6px}
  .chart-row .cat{order:1}
  .chart-bar-track{order:2}
  .chart-row .mono{order:3; text-align:left}
  table.report{min-width:480px}

  .modal-bg{align-items:flex-end}
  .modal{width:100%; max-width:100%; max-height:88vh; border-radius:14px 14px 0 0; padding:24px 20px calc(20px + env(safe-area-inset-bottom))}
  .field-row{flex-direction:column; gap:0}
  .modal-actions .btn{flex:1; text-align:center}
  .toast{left:16px; right:16px; bottom:88px; text-align:center}
}
@media(max-width:400px){ .cards-row{grid-template-columns:1fr} }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="vk">Horas</div>
    <div class="sub">Gestor de tiempo</div>
  </div>
  <nav>
    <button class="nav-btn on" data-view="proyectos">Proyectos</button>
    <button class="nav-btn" data-view="plazos">Plazos</button>
    <button class="nav-btn" data-view="informes">Informes</button>
  </nav>
  <div class="sidebar-foot">
    <div class="tagline">Cada hora, contabilizada.</div>
  </div>
</aside>

<main>

  <!-- ===================== PROYECTOS (lista) ===================== -->
  <section class="view on" id="view-proyectos">
    <div class="view-head">
      <h1>Proyectos</h1>
      <button class="btn primary" id="btn-new-proyecto">+ Nuevo proyecto</button>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
  </section>

  <!-- ===================== PROYECTO (detalle) ===================== -->
  <section class="view" id="view-proyecto-detalle">
    <button class="back-link" id="btn-back-proyectos">← Proyectos</button>
    <div class="proj-detail-head">
      <div>
        <h1 id="pd-nombre">—</h1>
        <div class="proj-client" id="pd-cliente"></div>
      </div>
      <div class="proj-meta" id="pd-horas"></div>
    </div>

    <div class="section-title">
      <span>Tareas</span>
      <button class="btn small" id="btn-new-tarea">+ Tarea</button>
    </div>
    <div id="pd-tareas"></div>

    <div class="section-title">
      <span>Registro de horas</span>
      <button class="btn small" id="btn-new-entrada">+ Registrar tiempo</button>
    </div>
    <div id="pd-entradas"></div>
  </section>

  <!-- ===================== PLAZOS ===================== -->
  <section class="view" id="view-plazos">
    <div class="view-head"><h1>Plazos</h1></div>
    <div id="plazos-list"></div>
  </section>

  <!-- ===================== INFORMES ===================== -->
  <section class="view" id="view-informes">
    <div class="view-head"><h1>Informes</h1></div>
    <div class="cards-row" id="informe-cards"></div>
    <div class="chart-block">
      <h3 style="font-size:16px; margin-bottom:14px; color:var(--g); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.08em; font-weight:400">Horas por proyecto</h3>
      <div id="chart-proyectos"></div>
    </div>
    <div class="chart-block">
      <h3 style="font-size:16px; margin-bottom:14px; color:var(--g); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.08em; font-weight:400">Tareas con más horas</h3>
      <div class="table-scroll">
        <table class="report" id="tabla-top">
          <thead><tr><th>Tarea</th><th>Proyecto</th><th>Horas</th><th>Estado</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<!-- ===================== MODALES ===================== -->
<div class="modal-bg" id="modal-proyecto">
  <div class="modal">
    <h2>Nuevo proyecto</h2>
    <div class="field"><label class="label">Nombre</label><input type="text" id="np-nombre"></div>
    <div class="field"><label class="label">Cliente (opcional)</label><input type="text" id="np-cliente"></div>
    <div class="field"><label class="label">Fecha de inicio</label><input type="date" id="np-fecha"></div>
    <div class="modal-actions">
      <button class="btn ghost" data-close="modal-proyecto">Cancelar</button>
      <button class="btn primary" id="np-guardar">Crear</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-tarea">
  <div class="modal">
    <h2 id="nt-titulo-modal">Nueva tarea</h2>
    <input type="hidden" id="nt-id">
    <div class="field"><label class="label">Título</label><input type="text" id="nt-titulo"></div>
    <div class="field"><label class="label">Descripción (opcional)</label><textarea id="nt-desc" rows="3"></textarea></div>
    <div class="field-row">
      <div class="field"><label class="label">Fecha límite</label><input type="date" id="nt-fecha"></div>
      <div class="field">
        <label class="label">Prioridad</label>
        <select id="nt-prioridad">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label class="label">Estado</label>
      <select id="nt-estado">
        <option value="pendiente">Pendiente</option>
        <option value="en_curso">En curso</option>
        <option value="completada">Completada</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-close="modal-tarea">Cancelar</button>
      <button class="btn primary" id="nt-guardar">Guardar</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-entrada">
  <div class="modal">
    <h2>Registrar tiempo</h2>
    <div class="field">
      <label class="label">Tarea</label>
      <select id="ne-tarea"></select>
    </div>
    <div class="field-row">
      <div class="field"><label class="label">Fecha</label><input type="date" id="ne-fecha"></div>
      <div class="field"><label class="label">Horas</label><input type="number" id="ne-horas" min="0.5" step="0.5" placeholder="1.5"></div>
    </div>
    <div class="field"><label class="label">Descripción</label><textarea id="ne-desc" rows="3" placeholder="¿En qué has trabajado?"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" data-close="modal-entrada">Cancelar</button>
      <button class="btn primary" id="ne-guardar">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api';
let state = { proyectoActual: null };

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 2200); }
async function api(path, opts={}){
  const res = await fetch(API + path, { headers:{'Content-Type':'application/json'}, ...opts });
  if(!res.ok){ toast('Error: ' + res.status); throw new Error('API error ' + res.status); }
  return res.json();
}
function fmtFecha(f){ if(!f) return '—'; const d = new Date(f + 'T00:00:00'); return d.toLocaleDateString('es-ES', {day:'numeric', month:'short'}); }
function diasHasta(f){ const hoy = new Date(); hoy.setHours(0,0,0,0); const d = new Date(f + 'T00:00:00'); return Math.round((d-hoy)/86400000); }
function estadoLabel(e){ return {pendiente:'Pendiente', en_curso:'En curso', completada:'Completada'}[e] || e; }

/* ---------------- NAV ---------------- */
function irAVista(id){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  const btn = document.querySelector(`.nav-btn[data-view="${id}"]`);
  if(btn) btn.classList.add('on');
  document.getElementById('view-' + id).classList.add('on');
  if(id === 'proyectos') cargarProyectos();
  if(id === 'plazos') cargarPlazos();
  if(id === 'informes') cargarInformes();
}
document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click', ()=>irAVista(btn.dataset.view)));

function openModal(id){ document.getElementById(id).classList.add('on'); }
function closeModal(id){ document.getElementById(id).classList.remove('on'); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>closeModal(b.dataset.close)));

/* ---------------- PROYECTOS ---------------- */
document.getElementById('btn-new-proyecto').addEventListener('click', ()=>openModal('modal-proyecto'));
document.getElementById('np-guardar').addEventListener('click', async ()=>{
  const nombre = document.getElementById('np-nombre').value.trim();
  if(!nombre){ toast('Falta el nombre'); return; }
  await api('/proyectos', { method:'POST', body: JSON.stringify({
    nombre, cliente: document.getElementById('np-cliente').value.trim() || null,
    fecha_inicio: document.getElementById('np-fecha').value || null
  })});
  closeModal('modal-proyecto');
  document.getElementById('np-nombre').value = '';
  document.getElementById('np-cliente').value = '';
  cargarProyectos();
  toast('Proyecto creado');
});

async function cargarProyectos(){
  const proyectos = await api('/proyectos');
  const grid = document.getElementById('proj-grid');
  if(proyectos.length === 0){ grid.innerHTML = '<div class="empty">Todavía no hay proyectos</div>'; return; }
  grid.innerHTML = proyectos.map(p => `
    <div class="proj-card" data-open="${p.id}">
      <div>
        <div class="proj-name">${p.nombre}</div>
        <div class="proj-client">${p.cliente || 'Sin cliente'} · ${p.num_tareas} tarea${p.num_tareas==1?'':'s'}</div>
      </div>
      <div class="proj-meta">${Number(p.horas_totales).toFixed(1)}h<br>${p.estado}</div>
    </div>`).join('');
  grid.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>abrirProyecto(el.dataset.open)));
}

document.getElementById('btn-back-proyectos').addEventListener('click', ()=>irAVista('proyectos'));

async function abrirProyecto(id){
  state.proyectoActual = id;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-proyecto-detalle').classList.add('on');
  await cargarDetalleProyecto();
}

async function cargarDetalleProyecto(){
  const id = state.proyectoActual;
  const proyectos = await api('/proyectos');
  const p = proyectos.find(x => String(x.id) === String(id));
  if(!p) return;
  document.getElementById('pd-nombre').textContent = p.nombre;
  document.getElementById('pd-cliente').textContent = (p.cliente || 'Sin cliente') + ' · ' + p.estado;
  document.getElementById('pd-horas').textContent = Number(p.horas_totales).toFixed(1) + 'h registradas';

  const tareas = await api('/tareas?proyecto_id=' + id);
  const cont = document.getElementById('pd-tareas');
  cont.innerHTML = tareas.length ? tareas.map(t => `
    <div class="task-row">
      <div>
        <div class="title">${t.titulo}</div>
        ${t.descripcion ? `<div class="desc">${t.descripcion}</div>` : ''}
      </div>
      <div><span class="pill ${t.prioridad==='alta'?'high':''}">${t.prioridad}</span></div>
      <div><span class="pill ${t.estado==='completada'?'on-track':''}">${estadoLabel(t.estado)}</span></div>
      <div class="deadline">${fmtFecha(t.fecha_limite)}</div>
      <div class="task-actions">
        <button class="icon-btn" data-edit-tarea="${t.id}" title="Editar">✎</button>
        <button class="icon-btn" data-del-tarea="${t.id}" title="Eliminar">✕</button>
      </div>
    </div>`).join('') : '<div class="empty">Sin tareas todavía</div>';

  cont.querySelectorAll('[data-edit-tarea]').forEach(el=>el.addEventListener('click', ()=>editarTarea(tareas.find(t=>String(t.id)===el.dataset.editTarea))));
  cont.querySelectorAll('[data-del-tarea]').forEach(el=>el.addEventListener('click', async ()=>{
    await api('/tareas?id=' + el.dataset.delTarea, { method:'DELETE' });
    cargarDetalleProyecto();
  }));

  const entradas = await api('/tiempo?proyecto_id=' + id);
  const contE = document.getElementById('pd-entradas');
  contE.innerHTML = entradas.length ? entradas.map(e => `
    <div class="entry-row">
      <div class="fecha">${fmtFecha(e.fecha)}</div>
      <div>
        <div class="desc">${e.descripcion || '—'}</div>
        <div class="tarea-ref">${e.tarea_titulo}</div>
      </div>
      <div class="horas">${Number(e.horas).toFixed(1)}h</div>
      <div class="del" data-del-entrada="${e.id}">✕</div>
    </div>`).join('') : '<div class="empty">Sin horas registradas</div>';
  contE.querySelectorAll('[data-del-entrada]').forEach(el=>el.addEventListener('click', async ()=>{
    await api('/tiempo?id=' + el.dataset.delEntrada, { method:'DELETE' });
    cargarDetalleProyecto();
  }));
}

/* ---------------- TAREAS ---------------- */
document.getElementById('btn-new-tarea').addEventListener('click', ()=>{
  document.getElementById('nt-titulo-modal').textContent = 'Nueva tarea';
  document.getElementById('nt-id').value = '';
  document.getElementById('nt-titulo').value = '';
  document.getElementById('nt-desc').value = '';
  document.getElementById('nt-fecha').value = '';
  document.getElementById('nt-prioridad').value = 'media';
  document.getElementById('nt-estado').value = 'pendiente';
  openModal('modal-tarea');
});
function editarTarea(t){
  document.getElementById('nt-titulo-modal').textContent = 'Editar tarea';
  document.getElementById('nt-id').value = t.id;
  document.getElementById('nt-titulo').value = t.titulo;
  document.getElementById('nt-desc').value = t.descripcion || '';
  document.getElementById('nt-fecha').value = t.fecha_limite ? t.fecha_limite.slice(0,10) : '';
  document.getElementById('nt-prioridad').value = t.prioridad;
  document.getElementById('nt-estado').value = t.estado;
  openModal('modal-tarea');
}
document.getElementById('nt-guardar').addEventListener('click', async ()=>{
  const titulo = document.getElementById('nt-titulo').value.trim();
  if(!titulo){ toast('Falta el título'); return; }
  const id = document.getElementById('nt-id').value;
  const payload = {
    titulo, descripcion: document.getElementById('nt-desc').value.trim() || null,
    fecha_limite: document.getElementById('nt-fecha').value || null,
    prioridad: document.getElementById('nt-prioridad').value,
    estado: document.getElementById('nt-estado').value
  };
  if(id){ await api('/tareas?id=' + id, { method:'PATCH', body: JSON.stringify(payload) }); }
  else { await api('/tareas', { method:'POST', body: JSON.stringify({ ...payload, proyecto_id: state.proyectoActual }) }); }
  closeModal('modal-tarea');
  cargarDetalleProyecto();
  toast('Tarea guardada');
});

/* ---------------- ENTRADAS DE TIEMPO ---------------- */
document.getElementById('btn-new-entrada').addEventListener('click', async ()=>{
  const tareas = await api('/tareas?proyecto_id=' + state.proyectoActual);
  const sel = document.getElementById('ne-tarea');
  sel.innerHTML = tareas.map(t => `<option value="${t.id}">${t.titulo}</option>`).join('') || '<option value="">Crea una tarea primero</option>';
  document.getElementById('ne-fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('ne-horas').value = '';
  document.getElementById('ne-desc').value = '';
  openModal('modal-entrada');
});
document.getElementById('ne-guardar').addEventListener('click', async ()=>{
  const tareaId = document.getElementById('ne-tarea').value;
  const fecha = document.getElementById('ne-fecha').value;
  const horas = parseFloat(document.getElementById('ne-horas').value);
  if(!tareaId || !fecha || !horas){ toast('Completa tarea, fecha y horas'); return; }
  await api('/tiempo', { method:'POST', body: JSON.stringify({
    tarea_id: tareaId, fecha, horas, descripcion: document.getElementById('ne-desc').value.trim() || null
  })});
  closeModal('modal-entrada');
  cargarDetalleProyecto();
  toast('Tiempo registrado');
});

/* ---------------- PLAZOS ---------------- */
async function cargarPlazos(){
  const tareas = await api('/tareas');
  const pendientes = tareas.filter(t => t.estado !== 'completada' && t.fecha_limite);
  pendientes.sort((a,b) => new Date(a.fecha_limite) - new Date(b.fecha_limite));
  const cont = document.getElementById('plazos-list');
  if(pendientes.length === 0){ cont.innerHTML = '<div class="empty">Sin plazos pendientes</div>'; return; }
  cont.innerHTML = pendientes.map(t => {
    const dias = diasHasta(t.fecha_limite);
    const cls = dias < 0 ? 'overdue' : (dias <= 3 ? 'soon' : '');
    const texto = dias < 0 ? `Hace ${Math.abs(dias)}d` : dias === 0 ? 'Hoy' : dias === 1 ? 'Mañana' : `En ${dias}d`;
    return `
      <div class="deadline-item ${cls}" data-open-proj="${t.proyecto_id}">
        <div class="deadline-info">
          <div class="t">${t.titulo}</div>
          <div class="p">${t.proyecto_nombre}</div>
        </div>
        <div class="deadline-date ${cls}">${texto}</div>
      </div>`;
  }).join('');
  cont.querySelectorAll('[data-open-proj]').forEach(el=>el.addEventListener('click', ()=>abrirProyecto(el.dataset.openProj)));
}

/* ---------------- INFORMES ---------------- */
async function cargarInformes(){
  const data = await api('/informes');
  document.getElementById('informe-cards').innerHTML = `
    <div class="stat-card"><div class="label">Horas totales</div><div class="stat-num">${data.metricas.horas_totales.toFixed(1)}</div></div>
    <div class="stat-card"><div class="label">Tareas / proyecto</div><div class="stat-num">${data.metricas.avg_tareas_proyecto.toFixed(1)}</div></div>
    <div class="stat-card"><div class="label">% Completado</div><div class="stat-num">${data.metricas.tasa_completado}%</div></div>
    <div class="stat-card"><div class="label">Horas / tarea</div><div class="stat-num">${data.metricas.avg_horas_tarea.toFixed(1)}</div></div>
  `;
  const maxH = Math.max(1, ...data.horas_por_proyecto.map(p=>p.horas));
  document.getElementById('chart-proyectos').innerHTML = data.horas_por_proyecto.map(p => `
    <div class="chart-row">
      <div class="mono" style="font-size:12px">${p.nombre}</div>
      <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${(p.horas/maxH)*100}%"></div></div>
      <div class="mono" style="text-align:right">${p.horas.toFixed(1)}h</div>
    </div>`).join('') || '<div class="empty">Sin datos todavía</div>';

  const tbody = document.querySelector('#tabla-top tbody');
  tbody.innerHTML = data.tareas_top.map(t => `
    <tr><td>${t.titulo}</td><td>${t.proyecto_nombre}</td><td>${Number(t.horas).toFixed(1)}h</td><td>${estadoLabel(t.estado)}</td></tr>
  `).join('') || '<tr><td colspan="4" class="empty">Sin datos todavía</td></tr>';
}

cargarProyectos();
</script>
</body>
